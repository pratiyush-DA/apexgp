[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexgraph"
version = "1.0.0"
description = "Independent Code Knowledge Graph and Developer Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ApexGraph Team"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-bash>=0.25.0",
    "tree-sitter-json>=0.24.0",
    "pyyaml>=6.0.0",
    "sqlglot>=25.0.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
]

[project.scripts]
apexgp = "packages.mcp.server:main"
apexgraph = "packages.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]
exclude = ["tests*", "data*", "Workflow_Documentation*", "output_benchmark_*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
